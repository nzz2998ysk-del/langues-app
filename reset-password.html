<script>(function(){try{
  var t = localStorage.getItem('lang_theme');
  if(t!=='dark'&&t!=='light'){t=((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');} document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();</script>
<link rel="stylesheet" href="/design-system/ios27-liquid-glass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--ig27-font-family)}
html,body{height:100%}
body{background:
    radial-gradient(1100px 520px at 8% -10%, color-mix(in srgb,var(--ig27-accent) 10%,transparent), transparent 60%),
    radial-gradient(900px 480px at 100% 100%, color-mix(in srgb,var(--ig27-accent) 12%,transparent), transparent 55%),
    var(--bg);
  color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:400px;width:100%}
h1{font-size:var(--ig27-fs-title2);line-height:var(--ig27-lh-title2);letter-spacing:var(--ig27-ls-title2);font-weight:var(--ig27-weight-bold);margin-bottom:8px;text-align:center}
.lead{color:var(--muted);font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);margin-bottom:22px;text-align:center}
.card{background:var(--ig27-glass-regular-bg);-webkit-backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));
  border:1px solid var(--ig27-glass-rim-color);border-radius:var(--ig27-radius-xxxl);padding:26px;
  box-shadow:0 20px 48px -16px color-mix(in srgb,var(--ig27-black) 18%,transparent),inset 0 1px 0 color-mix(in srgb,var(--ig27-white) 50%,transparent)}
label{display:block;font-size:var(--ig27-fs-caption1);line-height:var(--ig27-lh-caption1);letter-spacing:var(--ig27-ls-caption1);font-weight:var(--ig27-weight-semibold);color:var(--muted);margin-bottom:8px}
.field + .field{margin-top:18px}
input[type=password]{width:100%;background:var(--ig27-fill-quaternary);border:1px solid var(--line);border-radius:var(--ig27-radius-xl);
  padding:13px 14px;font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);color:var(--ink);font-family:inherit}
input[type=password]:focus{outline:none;box-shadow:0 0 0 4px var(--ig27-accent-soft);border-color:var(--primary)}
button{margin-top:20px;width:100%;background:var(--primary);color:var(--ig27-on-accent);border:none;border-radius:var(--ig27-radius-glass);padding:15px;
  font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);font-weight:var(--ig27-weight-semibold);cursor:pointer;transition:background var(--ig27-duration-fast),transform var(--ig27-duration-fast) var(--ig27-ease-spring);
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--ig27-accent) 40%,transparent)}
button:hover{background:var(--primary-dark)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default;box-shadow:var(--ig27-shadow-sm)}
.msg{font-size:var(--ig27-fs-footnote);line-height:var(--ig27-lh-footnote);letter-spacing:var(--ig27-ls-footnote);margin-top:14px;text-align:center;color:var(--red)}
.msg.ok{color:var(--green)}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:var(--ig27-fs-footnote);line-height:var(--ig27-lh-footnote);letter-spacing:var(--ig27-ls-footnote);text-decoration:none}
</style>
<link rel="stylesheet" href="/design-system/ios27-app.css">
<link rel="stylesheet" href="/design-system/papote.css">
</head>
<body class="pp-page">
<div class="wrap">
  <header class="pp-top"><a class="pp-brand" href="/" aria-label="Papote"><!--BRAND_LOGO--><span class="pp-word"><i></i>Papote</span></a></header>
  <h1>🔑 Nouveau mot de passe</h1>
  <p class="lead" id="lead">Choisis un nouveau mot de passe pour ton compte.</p>
  <div class="card" id="formCard">
    <div class="field">
      <label for="pass">Nouveau mot de passe</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirme le mot de passe</label>
      <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button id="saveBtn" data-click="submitReset">Réinitialiser</button>
    <div class="msg" id="status"></div>
  </div>
  <a class="back" href="/">‹ Retour à la connexion</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var token = params.get('token') || '';
if (!token){
  document.getElementById('lead').textContent = "Ce lien est invalide. Refais une demande depuis la page de connexion.";
  document.getElementById('formCard').style.display = 'none';
}

async function submitReset(){
  var btn = document.getElementById('saveBtn');
  var status = document.getElementById('status');
  var pass = document.getElementById('pass').value || '';
  var confirm = document.getElementById('confirm').value || '';
  status.className = 'msg';
  if (pass.length < 8){ status.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return; }
  if (pass !== confirm){ status.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  try {
    var r = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: token, password: pass})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (r.ok){
      status.textContent = 'Mot de passe mis à jour ✓ Redirection…';
      status.classList.add('ok');
      setTimeout(function(){ window.location.href = '/'; }, 1500);
      return;
    } else {
      status.textContent = data.error || "Impossible de réinitialiser pour le moment.";
    }
  } catch(e){
    status.textContent = 'Erreur réseau.';
  }
  btn.disabled = false;
  btn.textContent = 'Réinitialiser';
}
</script>
<script>
// Click delegation: [data-click="fn"] calls the global fn (with data-arg if set).
// No inline onclick attributes, so the Content-Security-Policy can forbid them.
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-click]');
  if (!el) return;
  var fn = window[el.dataset.click];
  if (typeof fn === 'function') fn.apply(null, el.dataset.arg !== undefined ? [el.dataset.arg] : []);
});
</script>
</body>
</html>
