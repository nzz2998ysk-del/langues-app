<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes langues — Réinitialiser le mot de passe</title>
<script>(function(){try{
  var t = localStorage.getItem('lang_theme');
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--ink:#201C2E;--muted:#726C8A;--bg:#F5F1EC;--surface:#fff;--primary:#3D348B;--primary-dark:#241F5C;--line:rgba(32,28,46,.09);--green:#2E9E6D;--red:#E1524B}
:root[data-theme="dark"]{--ink:#F0EDF7;--muted:#A39CC4;--bg:#181521;--surface:#221E30;--line:rgba(255,255,255,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F0EDF7;--muted:#A39CC4;--bg:#181521;--surface:#221E30;--line:rgba(255,255,255,.08)}}
html,body{height:100%}
body{background:
    radial-gradient(1100px 520px at 8% -10%, rgba(61,52,139,.10), transparent 60%),
    radial-gradient(900px 480px at 100% 100%, rgba(217,164,65,.14), transparent 55%),
    var(--bg);
  color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:400px;width:100%}
h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px;text-align:center}
.lead{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:22px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 50px -28px rgba(23,26,24,.25)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.field + .field{margin-top:18px}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:14.5px;color:var(--ink);font-family:inherit}
input[type=password]:focus{outline:2px solid var(--primary);outline-offset:1px}
button{margin-top:20px;width:100%;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:15px;
  font-size:15px;font-weight:800;cursor:pointer;transition:background .15s}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:13px;margin-top:14px;text-align:center;color:var(--red)}
.msg.ok{color:var(--green)}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Nouveau mot de passe</h1>
  <p class="lead" id="lead">Choisis un nouveau mot de passe pour ton compte.</p>
  <div class="card" id="formCard">
    <div class="field">
      <label for="pass">Nouveau mot de passe</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirme le mot de passe</label>
      <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button id="saveBtn" onclick="submitReset()">Réinitialiser</button>
    <div class="msg" id="status"></div>
  </div>
  <a class="back" href="/">‹ Retour à la connexion</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var token = params.get('token') || '';
if (!token){
  document.getElementById('lead').textContent = "Ce lien est invalide. Refais une demande depuis la page de connexion.";
  document.getElementById('formCard').style.display = 'none';
}

async function submitReset(){
  var btn = document.getElementById('saveBtn');
  var status = document.getElementById('status');
  var pass = document.getElementById('pass').value || '';
  var confirm = document.getElementById('confirm').value || '';
  status.className = 'msg';
  if (pass.length < 6){ status.textContent = 'Le mot de passe doit contenir au moins 6 caractères.'; return; }
  if (pass !== confirm){ status.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  try {
    var r = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: token, password: pass})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (r.ok){
      status.textContent = 'Mot de passe mis à jour ✓ Redirection…';
      status.classList.add('ok');
      setTimeout(function(){ window.location.href = '/'; }, 1500);
      return;
    } else {
      status.textContent = data.error || "Impossible de réinitialiser pour le moment.";
    }
  } catch(e){
    status.textContent = 'Erreur réseau.';
  }
  btn.disabled = false;
  btn.textContent = 'Réinitialiser';
}
</script>
</body>
</html>
