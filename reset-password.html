<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes langues — Réinitialiser le mot de passe</title>
<script>(function(){try{
  var t = localStorage.getItem('lang_theme');
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,sans-serif}
:root{--ink:#1d1d1f;--muted:#6e6e73;--bg:#f5f5f7;--surface:rgba(255,255,255,.6);--surface-border:rgba(255,255,255,.5);--primary:#0088ff;--primary-dark:#006edb;--line:rgba(0,0,0,.08);--green:#34C759;--red:#d70015;--glass-blur:blur(20px) saturate(1.8);}
:root[data-theme="dark"]{--ink:#f5f5f7;--muted:#98989d;--bg:#000000;--surface:rgba(28,28,30,.55);--surface-border:rgba(255,255,255,.1);--primary:#0091ff;--primary-dark:#37a4ff;--line:rgba(255,255,255,.1);--red:#ff6961;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f5f5f7;--muted:#98989d;--bg:#000000;--surface:rgba(28,28,30,.55);--surface-border:rgba(255,255,255,.1);--primary:#0091ff;--primary-dark:#37a4ff;--line:rgba(255,255,255,.1);--red:#ff6961;}}
html,body{height:100%}
body{background:
    radial-gradient(1100px 520px at 8% -10%, rgba(0,136,255,.10), transparent 60%),
    radial-gradient(900px 480px at 100% 100%, rgba(217,164,65,.12), transparent 55%),
    var(--bg);
  color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:400px;width:100%}
h1{font-size:22px;line-height:28px;letter-spacing:-.026em;font-weight:700;margin-bottom:8px;text-align:center}
.lead{color:var(--muted);font-size:15px;line-height:20px;letter-spacing:-.023em;margin-bottom:22px;text-align:center}
.card{background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--surface-border);border-radius:28px;padding:26px;
  box-shadow:0 20px 48px -16px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:8px}
.field + .field{margin-top:18px}
input[type=password]{width:100%;background:rgba(120,120,128,.08);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:15px;color:var(--ink);font-family:inherit}
input[type=password]:focus{outline:none;box-shadow:0 0 0 4px rgba(0,136,255,.15);border-color:var(--primary)}
button{margin-top:20px;width:100%;background:var(--primary);color:#fff;border:none;border-radius:980px;padding:15px;
  font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:background .15s,transform .15s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 6px 16px -4px rgba(0,136,255,.4)}
button:hover{background:var(--primary-dark)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default;box-shadow:none}
.msg{font-size:13px;margin-top:14px;text-align:center;color:var(--red)}
.msg.ok{color:var(--green)}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Nouveau mot de passe</h1>
  <p class="lead" id="lead">Choisis un nouveau mot de passe pour ton compte.</p>
  <div class="card" id="formCard">
    <div class="field">
      <label for="pass">Nouveau mot de passe</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirme le mot de passe</label>
      <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button id="saveBtn" onclick="submitReset()">Réinitialiser</button>
    <div class="msg" id="status"></div>
  </div>
  <a class="back" href="/">‹ Retour à la connexion</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var token = params.get('token') || '';
if (!token){
  document.getElementById('lead').textContent = "Ce lien est invalide. Refais une demande depuis la page de connexion.";
  document.getElementById('formCard').style.display = 'none';
}

async function submitReset(){
  var btn = document.getElementById('saveBtn');
  var status = document.getElementById('status');
  var pass = document.getElementById('pass').value || '';
  var confirm = document.getElementById('confirm').value || '';
  status.className = 'msg';
  if (pass.length < 6){ status.textContent = 'Le mot de passe doit contenir au moins 6 caractères.'; return; }
  if (pass !== confirm){ status.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  try {
    var r = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: token, password: pass})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (r.ok){
      status.textContent = 'Mot de passe mis à jour ✓ Redirection…';
      status.classList.add('ok');
      setTimeout(function(){ window.location.href = '/'; }, 1500);
      return;
    } else {
      status.textContent = data.error || "Impossible de réinitialiser pour le moment.";
    }
  } catch(e){
    status.textContent = 'Erreur réseau.';
  }
  btn.disabled = false;
  btn.textContent = 'Réinitialiser';
}
</script>
</body>
</html>
