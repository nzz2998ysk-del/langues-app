<script>
(function(){
  window.addEventListener('message', function(e){
    var m = e.data;
    if (!m || m.type !== 'langues_export_backup') return;
    // Only act on messages that actually come from one of our own embedded
    // language pages (srcdoc iframes have an opaque "null" origin, so we
    // verify by window identity instead of e.origin).
    var fromKnownFrame = false;
    try{
      for (var k in frames){ if (frames[k] && frames[k].contentWindow === e.source){ fromKnownFrame = true; break; } }
    }catch(err){}
    if (!fromKnownFrame) return;
    try{
      if (window.claude && typeof window.claude.use === 'function'){
        window.claude.use('downloads').then(function(downloads){
          if (downloads){ downloads.save({filename: m.filename, data: m.data}).catch(function(){}); }
        });
      }
    }catch(err){}
  });
})();
</script>

<script>
// Opening animation: full version once per browser session, then the plain
// loading sheet (coming back from /profile or /admin should not replay it).
(function(){
  var ov = document.getElementById("loadingOverlay");
  var seen = false;
  try { seen = sessionStorage.getItem("papoteIntro") === "1"; sessionStorage.setItem("papoteIntro", "1"); } catch (e) {}
  if (seen) { ov.classList.remove("intro"); window.__introUntil = 0; return; }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.__introUntil = Date.now() + (reduce ? 500 : 1900);
  if (reduce) return;
  var hellos = ["Bonjour", "Hello", "¡Hola!", "Ciao", "こんにちは", "Olá", "مرحبا", "Hallo", "안녕하세요", "Привет", "שלום", "你好"];
  var i = 0, el = document.getElementById("introHello");
  var timer = setInterval(function(){
    if (!document.body.contains(el) || ov.classList.contains("hide")) { clearInterval(timer); return; }
    i = (i + 1) % hellos.length; el.textContent = hellos[i];
  }, 260);
})();
</script>

var frames = {};       // key "lang__page.html" -> iframe element
var resizers = {};
var allKeys = Object.keys(ALL_PAGES);

var UI_BASE = "fr";
function tr(key, vars){ return window.I18N ? I18N.t(UI_BASE, key, vars) : key; }

function resizeFrame(key){
  var f = frames[key];
  if (!f) return;
  try{
    var doc = f.contentDocument;
    if (!doc || !doc.documentElement) return;
    var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
    if (h > 0) f.style.height = h + "px";
  }catch(e){}
}

function buildFrame(key){
  // Chargement à la demande : ce module (langue+page) n'est construit que
  // lors de la toute première visite, au lieu des 48 pages d'un coup au
  // démarrage. Ça allège nettement le premier chargement sans rien changer
  // visuellement une fois qu'on y est.
  var f = document.createElement("iframe");
  f.setAttribute("allow", "microphone");
  f.id = "frame-" + key;
  container.appendChild(f);
  frames[key] = f;
  f.addEventListener("load", function(){
    resizeFrame(key);
    try{
      var doc = f.contentDocument;
      if (doc && window.ResizeObserver){
        var ro = new ResizeObserver(function(){ resizeFrame(key); });
        ro.observe(doc.documentElement);
        resizers[key] = ro;
      }
    }catch(e){}
    loaded++;
  }, {once:true});
  f.srcdoc = ALL_PAGES[key];
  return f;
}

function finishLoading(){
  var overlay = document.getElementById("loadingOverlay");
  // Let the opening animation play to the end before revealing the hub.
  var wait = Math.max(0, (window.__introUntil || 0) - Date.now());
  setTimeout(function(){
    overlay.classList.add("hide");
    setTimeout(function(){ overlay.style.display = "none"; }, 480);
  }, wait);
  // On atterrit sur le hub d'accueil (choix de la langue), pas directement dans une langue.
}

setInterval(function(){ if (current) resizeFrame(current); }, 700);

function showPage(key){
  if (!ALL_PAGES[key]) return;
  if (!frames[key]){
    buildFrame(key);
  } else if (key !== current){
    frames[key].srcdoc = ALL_PAGES[key];
  }
  allKeys.forEach(function(k){ if (frames[k]) frames[k].classList.toggle("on", k === key); });
  current = key;
  resizeFrame(key);
  window.scrollTo(0, 0);
  var parts = key.split("__");
  var lang = parts[0], page = parts[1];
  currentLang = lang;
  lastPage[lang] = page;
  var meta = LANG_META[lang];
  if (meta){
    document.getElementById("appTopFlag").textContent = meta.flag;
    document.getElementById("appTopName").textContent = meta.name;
  }
  document.querySelectorAll(".tabbtn").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-page") === page);
  });
  setTimeout(function(){ resizeFrame(key); }, 200);
}

// Toutes les langues sont accessibles gratuitement au niveau de base ; seuls le
// feedback, les leçons et les exercices avancés sont réservés au Premium (géré
// page par page via /api/features, pas au niveau de la langue elle-même).
function openLang(lang){
  document.body.classList.add("in-lang");
  var page = lastPage[lang] || "hub.html";
  showPage(lang + "__" + page);
}

var currentOrder = LANG_ORDER_DEFAULT.slice();
var reordering = false;
var dragSrc = null;

function renderHubGrid(order){
  var grid = document.getElementById("hubGrid");
  if (!grid) return;
  grid.innerHTML = "";
  order.forEach(function(code, i){
    var meta = LANG_META[code];
    if (!meta) return;
    var btn = document.createElement("button");
    btn.className = "hub-card";
    btn.setAttribute("data-lang", code);
    btn.style.setProperty("--card-color", meta.color);
    btn.style.setProperty("--i", i % 20);
    btn.draggable = reordering;
    btn.innerHTML = '<span class="hub-flag">' + meta.flag + '</span><span class="hub-name">' + meta.name + '</span><span class="hub-lock">🔒</span><span class="hub-dev-badge">🚧 ' + tr("soon") + '</span>';
    if (window.LANG_DEV_CODES && window.LANG_DEV_CODES[code]) btn.classList.add("hub-card-dev");
    btn.addEventListener("click", function(){
      if (reordering) return;
      if (btn.classList.contains("hub-card-dev")) return;
      openLang(code);
    });
    btn.addEventListener("dragstart", function(e){ dragSrc = code; btn.classList.add("dragging"); try{ e.dataTransfer.setData("text/plain", code); }catch(err){} });
    btn.addEventListener("dragend", function(){ btn.classList.remove("dragging"); document.querySelectorAll(".hub-card.drag-over").forEach(function(c){ c.classList.remove("drag-over"); }); });
    btn.addEventListener("dragover", function(e){ if (!reordering) return; e.preventDefault(); btn.classList.add("drag-over"); });
    btn.addEventListener("dragleave", function(){ btn.classList.remove("drag-over"); });
    btn.addEventListener("drop", function(e){
      if (!reordering) return;
      e.preventDefault();
      btn.classList.remove("drag-over");
      var target = code;
      if (!dragSrc || dragSrc === target) return;
      var from = currentOrder.indexOf(dragSrc);
      var to = currentOrder.indexOf(target);
      if (from === -1 || to === -1) return;
      currentOrder.splice(from, 1);
      currentOrder.splice(to, 0, dragSrc);
      renderHubGrid(currentOrder);
      saveLangOrder(currentOrder);
    });
    grid.appendChild(btn);
  });
}

function toggleReorder(){
  reordering = !reordering;
  var btn = document.getElementById("hubReorderBtn");
  var grid = document.getElementById("hubGrid");
  if (btn) { btn.classList.toggle("active", reordering); btn.textContent = reordering ? "✓ " + tr("reorder_done") : "↕️ " + tr("reorder"); }
  if (grid) grid.classList.toggle("reordering", reordering);
  renderHubGrid(currentOrder);
}

function saveLangOrder(order){
  fetch("/api/lang-order", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({order: order})
  }).catch(function(){});
}

(function loadAccessState(){
  fetch("/api/me").then(function(r){ return r.ok ? r.json() : {authenticated:false}; }).then(function(me){
    if (me.isAdmin){
      var link = document.getElementById("hubAdminLink");
      if (link) link.style.display = "inline-flex";
    }
    // Interface language = the account's base language (profile setting).
    var baseCode = me.baseLang || "fr";
    var i18nReady = window.I18N ? I18N.load(baseCode).then(function(code){
      UI_BASE = code;
      document.documentElement.lang = code;
      document.documentElement.dir = I18N.rtl(code) ? "rtl" : "ltr";
      I18N.apply(code);
    }) : Promise.resolve();
    i18nReady.then(function(){
      var greet = document.getElementById("hubGreeting");
      if (greet){
        var base = LANG_META[baseCode] || LANG_META.fr;
        var hello = me.name ? tr("hub_hello", {name: me.name}) : tr("hub_choose");
        greet.textContent = hello + " · " + tr("hub_base", {lang: base.flag + " " + base.name});
      }
    });
    if (me.langOrder && Array.isArray(me.langOrder) && me.langOrder.length){
      var known = me.langOrder.filter(function(c){ return LANG_META[c]; });
      LANG_ORDER_DEFAULT.forEach(function(c){ if (known.indexOf(c) === -1) known.push(c); });
      currentOrder = known;
    }
    renderHubGrid(currentOrder);
    return fetch("/api/features").then(function(r){ return r.json(); }).then(function(data){
      var unlocked = data.unlocked || (me && me.isAdmin);
      var anyPremiumLocked = (data.features || []).some(function(f){ return f.locked; });
      var cta = document.getElementById("hubPremiumCta");
      if (cta) cta.style.display = (anyPremiumLocked && !unlocked) ? "block" : "none";
      window.LANG_DEV_CODES = {};
      Object.keys(data.languageStatus || {}).forEach(function(c){
        if (data.languageStatus[c] === "development") window.LANG_DEV_CODES[c] = true;
      });
      document.querySelectorAll(".hub-card").forEach(function(btn){
        var code = btn.getAttribute("data-lang");
        btn.classList.toggle("hub-card-dev", !!window.LANG_DEV_CODES[code]);
      });
    });
  }).catch(function(){ renderHubGrid(currentOrder); });
})();

function serverLogout(){
  // Offline mode caches API answers (personal data): wipe them on logout.
  try { if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } catch(e){}
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } catch(e){}
  fetch("/api/logout", {method:"POST"}).catch(function(){}).then(function(){
    window.location.href = "/";
  });
}

window.addEventListener("message", function(e){
  if (e.origin !== window.location.origin) return;
  var navPage = e.data && (e.data.modNav || e.data.ivritNav);
  if (!navPage) return;
  var lang = null;
  for (var k in frames){
    try{
      if (frames[k].contentWindow === e.source){ lang = k.split("__")[0]; break; }
    }catch(err){}
  }
  if (!lang) return;
  document.body.classList.add("in-lang");
  var targetKey = lang + "__" + navPage;
  showPage(targetKey);
  if (e.data.presetLevel && frames[targetKey]){
    try{
      frames[targetKey].contentWindow.postMessage({presetLevel: e.data.presetLevel}, "*");
    }catch(err){}
  }
});
window.addEventListener("resize", function(){
  if (current) resizeFrame(current);
});

<button class="themeToggle" id="__themeToggleBtnShell" title="Mode sombre / clair" aria-label="Basculer le mode sombre">🌙</button>
<script>(function(){
  var btn = document.getElementById('__themeToggleBtnShell');
  function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
  function paint(){ btn.textContent = isDark() ? '\u2600\ufe0f' : '\ud83c\udf19'; }
  paint();
  btn.addEventListener('click', function(){
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('lang_theme', next); }catch(e){}
    paint();
  });
  window.addEventListener('storage', function(e){
    if(e.key==='lang_theme'){
      document.documentElement.setAttribute('data-theme', (e.newValue==='dark'||e.newValue==='light') ? e.newValue : ((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));
      paint();
    }
  });
})();</script>
<script>
// Click delegation: [data-click="fn"] calls the global fn (with data-arg if set).
// No inline onclick attributes, so the Content-Security-Policy can forbid them.
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-click]');
  if (!el) return;
  var fn = window[el.dataset.click];
  if (typeof fn === 'function') fn.apply(null, el.dataset.arg !== undefined ? [el.dataset.arg] : []);
});
</script>
