<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/design-system/device.js"></script><script src="/design-system/liquid-glass.js"></script>
<title>Pap’pote — Boîte à idées</title><!--BRAND_HEAD-->
<script>(function(){try{
  var t = localStorage.getItem('lang_theme');
  if(t!=='dark'&&t!=='light'){t=((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');} document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();</script>
<link rel="stylesheet" href="/design-system/ios27-liquid-glass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--ig27-font-family)}
html,body{height:100%}
body{background:
    radial-gradient(1100px 520px at 8% -10%, color-mix(in srgb,var(--ig27-accent) 10%,transparent), transparent 60%),
    radial-gradient(900px 480px at 100% 100%, color-mix(in srgb,var(--ig27-accent) 12%,transparent), transparent 55%),
    var(--bg);
  color:var(--ink);min-height:100vh;padding:40px 20px}
.wrap{max-width:640px;margin:0 auto}
.topnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
h1{font-size:var(--ig27-fs-large-title);line-height:var(--ig27-lh-large-title);letter-spacing:var(--ig27-ls-large-title);font-weight:var(--ig27-weight-bold);margin-bottom:8px}
.lead{color:var(--muted);font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);margin-bottom:26px;max-width:520px}
.card{background:var(--ig27-glass-regular-bg);-webkit-backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));
  border:1px solid var(--ig27-glass-rim-color);border-radius:var(--ig27-radius-xxxl);padding:26px;
  box-shadow:0 20px 48px -16px color-mix(in srgb,var(--ig27-black) 18%,transparent),inset 0 1px 0 color-mix(in srgb,var(--ig27-white) 50%,transparent)}
label{display:block;font-size:var(--ig27-fs-caption1);line-height:var(--ig27-lh-caption1);letter-spacing:var(--ig27-ls-caption1);font-weight:var(--ig27-weight-semibold);color:var(--muted);margin-bottom:8px}
select{width:100%;background:var(--ig27-fill-quaternary);border:1px solid var(--line);border-radius:var(--ig27-radius-xl);padding:12px 14px;font-size:var(--ig27-fs-subheadline);color:var(--ink);font-family:inherit}
textarea{width:100%;min-height:140px;resize:vertical;background:var(--ig27-fill-quaternary);border:1px solid var(--line);border-radius:var(--ig27-radius-xl);
  padding:14px;font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);color:var(--ink);font-family:inherit}
textarea:focus{outline:none;box-shadow:0 0 0 4px var(--ig27-accent-soft);border-color:var(--primary)}
.count{text-align:right;font-size:var(--ig27-fs-caption1);line-height:var(--ig27-lh-caption1);letter-spacing:var(--ig27-ls-caption1);color:var(--muted);margin-top:6px}
button{margin-top:16px;width:100%;background:var(--primary);color:var(--ig27-on-accent);border:none;border-radius:var(--ig27-radius-glass);padding:15px;
  font-size:var(--ig27-fs-subheadline);line-height:var(--ig27-lh-subheadline);letter-spacing:var(--ig27-ls-subheadline);font-weight:var(--ig27-weight-semibold);cursor:pointer;transition:background var(--ig27-duration-fast),transform var(--ig27-duration-fast) var(--ig27-ease-spring);
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--ig27-accent) 40%,transparent)}
button:hover{background:var(--primary-dark)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default;box-shadow:var(--ig27-shadow-sm)}
.msg{font-size:var(--ig27-fs-footnote);line-height:var(--ig27-lh-footnote);letter-spacing:var(--ig27-ls-footnote);margin-top:14px;text-align:center;color:var(--red)}
.msg.ok{color:var(--green)}
.note{margin-top:22px;font-size:var(--ig27-fs-footnote);line-height:var(--ig27-lh-footnote);letter-spacing:var(--ig27-ls-footnote);color:var(--muted);background:var(--ig27-glass-regular-bg);
  -webkit-backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));backdrop-filter:blur(var(--ig27-glass-regular-blur)) saturate(var(--ig27-glass-regular-saturate));
  border:1px solid var(--ig27-glass-rim-color);border-radius:var(--ig27-radius-xxl);padding:14px 16px}
</style>
<link rel="stylesheet" href="/design-system/ios27-app.css">
<link rel="stylesheet" href="/design-system/papote.css">
<link rel="stylesheet" href="/design-system/liquid-glass.css">
<link rel="stylesheet" href="/design-system/responsive.css">
</head>
<body class="pp-page">
<div class="wrap" role="main">
  <div class="pp-top"><a class="pp-brand" href="/" aria-label="Pap’pote"><!--BRAND_LOGO--><span class="pp-word"><i></i>Pap’pote</span></a></div>
  <div class="topnav">
    <a class="ig27-back" href="/">‹ <span data-i18n="back_home">Retour à l'accueil</span></a>
  </div>
  <h1>💡 <span data-i18n="ideas_title">Boîte à idées</span></h1>
  <p class="lead" data-i18n="ideas_lead">Une idée de langue, une fonctionnalité qui te manque, un bug repéré ? Écris-le ici : chaque message est lu.</p>
  <div class="card">
    <label for="cat" data-i18n="ideas_cat">Catégorie</label>
    <select id="cat" style="margin-bottom:16px">
      <option value="fonctionnalite" data-i18n="cat_fonctionnalite">Fonctionnalité</option>
      <option value="contenu" data-i18n="cat_contenu">Contenu (mots, leçons, exercices)</option>
      <option value="langue" data-i18n="cat_langue">Nouvelle langue</option>
      <option value="design" data-i18n="cat_design">Design</option>
      <option value="bug" data-i18n="cat_bug">Bug</option>
      <option value="autre" data-i18n="cat_autre">Autre</option>
    </select>
    <label for="msg" data-i18n="ideas_label">Ton idée</label>
    <textarea id="msg" maxlength="2000" data-i18n-ph="ideas_ph" placeholder="Ex : Ajouter un mode audio pour la prononciation en coréen..."></textarea>
    <div class="count"><span id="count">0</span> / 2000</div>
    <button id="sendBtn" data-click="sendSuggestion" data-i18n="send">Envoyer</button>
    <div class="msg" id="status"></div>
  </div>
  <div class="note" data-i18n="ideas_note">Chaque idée est lue par l'équipe et reçoit un statut (vue, en cours, acceptée ou refusée).</div>
</div>
<script src="/course/i18n.js"></script>
<script>
var BASE = 'fr';
function tr(k){ return I18N.t(BASE, k); }
fetch('/api/me').then(function(r){ return r.ok ? r.json() : null; }).then(function(me){
  if (!me) return;
  return I18N.load(me.baseLang || 'fr').then(function(code){ BASE = code; document.documentElement.lang = code; document.documentElement.dir = I18N.rtl(code) ? 'rtl' : 'ltr'; I18N.apply(code); });
}).catch(function(){});
var ta = document.getElementById('msg');
var count = document.getElementById('count');
ta.addEventListener('input', function(){ count.textContent = ta.value.length; });

async function sendSuggestion(){
  var btn = document.getElementById('sendBtn');
  var status = document.getElementById('status');
  var text = ta.value.trim();
  status.className = 'msg';
  if (text.length < 3){ status.textContent = tr('ideas_short'); return; }
  btn.disabled = true;
  btn.textContent = tr('sending');
  try {
    var r = await fetch('/api/suggestions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, category: document.getElementById('cat').value})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (r.ok){
      ta.value = '';
      count.textContent = '0';
      status.textContent = tr('ideas_thanks');
      status.classList.add('ok');
    } else {
      status.textContent = data.error || tr('send_error');
    }
  } catch(e){
    status.textContent = tr('net_error');
  }
  btn.disabled = false;
  btn.textContent = tr('send');
}
</script>
<script>
// Click delegation: [data-click="fn"] calls the global fn (with data-arg if set).
// No inline onclick attributes, so the Content-Security-Policy can forbid them.
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-click]');
  if (!el) return;
  var fn = window[el.dataset.click];
  if (typeof fn === 'function') fn.apply(null, el.dataset.arg !== undefined ? [el.dataset.arg] : []);
});
</script>
</body>
</html>
