services:
  - type: web
    name: langues-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: langues-app-db
          property: connectionString

databases:
  - name: langues-app-db
    plan: free
    databaseName: langues_app
    user: langues_app
