services:
  - type: web
    name: langues-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: langues-app-db
          property: connectionString
      # Set by hand in the Render dashboard (kept out of the repository).
      - key: ADMIN_EMAIL
        sync: false
      - key: BUSINESS_NAME
        value: Papote
      # Transactional email (Resend). Both are set by hand in the Render
      # dashboard (service -> Environment), never committed: see .env.example.
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # AI conversation partner: key set by hand in the dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: langues-app-db
    plan: free
    databaseName: langues_app
    user: langues_app
