services:
  - type: web
    name: langues-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: langues-app-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: raphael.sanguinetti@icloud.com
      - key: BUSINESS_NAME
        value: Mes langues
      - key: EMAIL_FROM
        value: "Mes langues <onboarding@resend.dev>"
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: langues-app-db
    plan: free
    databaseName: langues_app
    user: langues_app
