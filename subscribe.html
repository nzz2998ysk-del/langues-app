<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes langues — Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--ink:#201C2E;--muted:#726C8A;--bg:#F5F1EC;--surface:#fff;--primary:#3D348B;--primary-dark:#241F5C;--line:rgba(32,28,46,.09);--gold:#D9A441}
@media (prefers-color-scheme: dark){:root{--ink:#F0EDF7;--muted:#A39CC4;--bg:#181521;--surface:#221E30;--line:rgba(255,255,255,.08)}}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;max-width:420px;width:100%;padding:32px 28px;text-align:center}
.badge{display:inline-block;background:var(--gold);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:14px}
h1{font-size:22px;margin-bottom:8px}
.desc{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:22px}
ul{list-style:none;text-align:left;margin-bottom:26px}
li{font-size:14px;padding:6px 0;display:flex;gap:8px}
li:before{content:"✓";color:#2E9E6D;font-weight:800}
button{width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:default}
a.back{display:block;margin-top:16px;color:var(--muted);font-size:13px;text-decoration:none}
.msg{font-size:13px;margin-top:14px;color:#E1524B}
.msg.ok{color:#2E9E6D}
</style>
</head>
<body>
<div class="card">
  <span class="badge">Premium</span>
  <h1>Débloque toutes les langues</h1>
  <div class="desc">Accède au chinois mandarin, portugais, russe, allemand et japonais, en plus des langues gratuites.</div>
  <ul>
    <li>9 langues au lieu de 4</li>
    <li>Nouveaux contenus ajoutés régulièrement</li>
    <li>Sans engagement</li>
  </ul>
  <button id="goBtn" onclick="startCheckout()">S'abonner</button>
  <div class="msg" id="msg"></div>
  <a class="back" href="/">‹ Retour à l'application</a>
</div>
<script>
var params = new URLSearchParams(location.search);
var msg = document.getElementById('msg');
if (params.get('canceled')) { msg.textContent = "Paiement annulé."; }
if (params.get('success')) { msg.textContent = "Paiement reçu, merci ! Ton accès premium est actif."; msg.classList.add('ok'); }

async function startCheckout(){
  var btn = document.getElementById('goBtn');
  btn.disabled = true;
  btn.textContent = 'Redirection…';
  try {
    var r = await fetch('/api/checkout', {method:'POST'});
    var data = await r.json();
    if (r.ok && data.url){
      window.location.href = data.url;
      return;
    }
    msg.textContent = data.error || "Le paiement n'est pas encore disponible.";
  } catch(e){
    msg.textContent = "Erreur réseau.";
  }
  btn.disabled = false;
  btn.textContent = "S'abonner";
}
</script>
</body>
</html>
